<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101010">

    <title>MT Instagram Contest</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #101010;

            color: white;

            font-family: -apple-system, BlinkMacSystemFont, sans-serif;

            text-align: center;

            padding: 24px;

        }

        .container {

            width: 100%;

            max-width: 440px;

            padding: 40px 24px;

            background: #1b1b1b;

            border: 1px solid #303030;

            border-radius: 28px;

        }

        .logo {

            font-size: 14px;

            letter-spacing: 4px;

            color: #aaa;

            margin-bottom: 35px;

        }

        .heart {

            font-size: 65px;

            margin-bottom: 20px;

        }

        h1 {

            font-size: 32px;

            line-height: 1.2;

            margin: 0 0 18px;

        }

        p {

            color: #bdbdbd;

            font-size: 17px;

            line-height: 1.6;

        }

        .highlight {

            color: #ff4b91;

            font-weight: 700;

        }

        .instagram {

            display: block;

            margin-top: 32px;

            padding: 17px;

            border-radius: 16px;

            color: white;

            text-decoration: none;

            font-weight: 700;

            font-size: 17px;

            background: linear-gradient(

                110deg,

                #833ab4,

                #fd1d1d,

                #fcb045

            );

        }

        .instagram:active {

            transform: scale(0.97);

        }

        footer {

            margin-top: 35px;

            font-size: 12px;

            color: #666;

        }

    </style>

</head>

<body>

    <main class="container">

        <div class="logo">MT PROJECT</div>

        <div class="heart">❤️</div>

        <h1>

            Кто наберёт больше лайков?

        </h1>

        <p>

            Тот сможет <span class="highlight">разместить тут свою страницу!</span>

        </p>

        <p>

            Участвуйте в конкурсе и собирайте лайки!

        </p>

        <a

            class="instagram"

            href="https://www.instagram.com/matvey_butusov/"

            target="_blank"

            rel="noopener noreferrer"

        >

            Перейти в Instagram →

        </a>

        <footer>

            MT Instagram Contest · 2026

        </footer>

    </main>

</body>

</html>
