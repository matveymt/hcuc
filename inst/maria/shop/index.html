<title>Пухляндия — Сквиш Туалетная Бумага</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0; padding: 0;
    background: #fdfaf6;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
  }
  .card {
    position: relative;
    background: #fff;
    width: 100%; max-width: 420px;
    padding: 24px 20px 70px;
    box-sizing: border-box;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo { font-size: 20px; font-weight: bold; color: #b08968; margin-bottom: 4px; }
  .logo img { width: 34px; vertical-align: middle; margin-left: 6px; }
  .photo {
    width: 100%; border-radius: 12px; margin: 16px 0;
    background: #f5efe8;
  }
  .title { font-size: 22px; font-weight: 700; color: #5a4634; margin: 8px 0 4px; }
  .price { font-size: 20px; color: #b08968; font-weight: bold; }
  .btn {
    display: inline-block; width: 80%; padding: 14px 0;
    margin-top: 16px; border: none; border-radius: 24px;
    font-size: 17px; font-weight: bold; cursor: pointer;
    background: #e8b4a0; color: #fff;
  }
  .btn:active { transform: scale(0.98); }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 10;
    justify-content: center; align-items: center;
  }
  .modal {
    background: #fff; border-radius: 16px; padding: 24px;
    max-width: 300px; width: 85%; text-align: center;
  }
  .modal h3 { margin: 0 0 8px; color: #5a4634; }
  .modal .btn { display: block; width: 100%; margin: 10px 0 0; text-decoration: none; }
  .call { background: #8fb996; }
  .close { background: #d9cfc4; }
  .footer {
    position: absolute; left: 20px; bottom: 16px;
    font-size: 12px; color: #a89b8c;
  }
</style>
