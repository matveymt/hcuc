<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Russia — Путешествия по России</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --primary: #1e3a8a;
    --accent: #dc2626;
    --gold: #f59e0b;
    --light: #f8fafc;
    --dark: #0f172a;
    --gray: #64748b;
    --card-bg: #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--light);
    color: var(--dark);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Header */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    transition: all 0.3s;
  }

  .nav {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
  }

  .lang-switcher {
    display: flex;
    gap: 6px;
    background: var(--light);
    padding: 5px;
    border-radius: 12px;
  }

  .lang-btn {
    padding: 8px 14px;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: var(--gray);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .lang-btn:hover { background: rgba(30,58,138,0.08); color: var(--primary); }
  .lang-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(30,58,138,0.3);
  }

  .flag { font-size: 16px; }

  /* Hero */
  .hero {
    height: 100vh;
    min-height: 600px;
    background: linear-gradient(rgba(15,23,42,0.55), rgba(30,58,138,0.7)),
      url('https://images.unsplash.com/photo-1513326738677-b964603b136d?w=1920&q=80') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 100px 24px 40px;
    position: relative;
  }

  .hero-content { max-width: 900px; animation: fadeUp 1s ease; }

  .hero h1 {
    font-size: clamp(38px, 6vw, 76px);
    font-weight: 900;
    margin-bottom: 20px;
    line-height: 1.1;
    letter-spacing: -1px;
  }

  .hero h1 span {
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    font-size: clamp(16px, 2vw, 22px);
    margin-bottom: 36px;
    opacity: 0.95;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 15px 34px;
    border-radius: 50px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 10px 30px rgba(220,38,38,0.4);
  }

  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(220,38,38,0.5); }

  .btn-outline {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 2px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
  }

  .btn-outline:hover { background: rgba(255,255,255,0.25); transform: translateY(-3px); }

  .scroll-hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    animation: bounce 2s infinite;
    font-size: 24px;
    opacity: 0.7;
  }

  /* Section */
  section { padding: 90px 24px; }

  .container { max-width: 1280px; margin: 0 auto; }

  .section-title {
    text-align: center;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--dark);
  }

  .section-subtitle {
    text-align: center;
    color: var(--gray);
    font-size: 17px;
    max-width: 620px;
    margin: 0 auto 50px;
  }

  /* Cities grid */
  .cities-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 26px;
  }

  .city-card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(15,23,42,0.06);
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
    position: relative;
  }

  .city-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 45px rgba(15,23,42,0.15);
  }

  .city-img {
    height: 220px;
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
  }

  .city-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 60%);
  }

  .city-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(255,255,255,0.95);
    padding: 5px 12px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    z-index: 2;
  }

  .city-name-overlay {
    position: absolute;
    bottom: 14px;
    left: 18px;
    color: white;
    font-size: 24px;
    font-weight: 800;
    z-index: 2;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .city-body { padding: 22px; }

  .city-desc {
    color: var(--gray);
    font-size: 15px;
    margin-bottom: 16px;
  }

  .city-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--gray);
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
  }

  .city-meta span { display: flex; align-items: center; gap: 5px; }

  /* Features */
  .features {
    background: linear-gradient(135deg, var(--primary), #1e40af);
    color: white;
  }

  .features .section-title { color: white; }
  .features .section-subtitle { color: rgba(255,255,255,0.8); }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }

  .feature-card {
    background: rgba(255,255,255,0.1);
    padding: 30px 24px;
    border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s;
  }

  .feature-card:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-5px);
  }

  .feature-icon { font-size: 40px; margin-bottom: 14px; }
  .feature-card h3 { font-size: 18px; margin-bottom: 8px; }
  .feature-card p { font-size: 14px; opacity: 0.85; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
    animation: fadeIn 0.3s;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: white;
    border-radius: 22px;
    max-width: 780px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: scaleIn 0.35s cubic-bezier(.2,.8,.2,1);
  }

  .modal-img {
    height: 300px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .modal-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 70%);
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.95);
    cursor: pointer;
    font-size: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover { background: var(--accent); color: white; transform: rotate(90deg); }

  .modal-title {
    position: absolute;
    bottom: 20px;
    left: 26px;
    color: white;
    font-size: 32px;
    font-weight: 800;
    z-index: 2;
  }

  .modal-body { padding: 30px; }

  .modal-body h4 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--primary);
    margin: 22px 0 10px;
  }

  .modal-body p { color: var(--gray); margin-bottom: 12px; }

  .modal-highlights {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .highlight-tag {
    background: #eff6ff;
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
  }

  /* Footer */
  footer {
    background: var(--dark);
    color: rgba(255,255,255,0.7);
    padding: 50px 24px 30px;
    text-align: center;
  }

  footer .logo { justify-content: center; color: white; margin-bottom: 16px; }
  footer p { font-size: 14px; margin-bottom: 8px; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes bounce {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 10px); }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .nav { flex-direction: column; gap: 12px; padding: 12px 16px; }
    .lang-btn { padding: 6px 10px; font-size: 12px; }
    .lang-btn .flag { font-size: 14px; }
    section { padding: 60px 16px; }
    .city-name-overlay { font-size: 20px; }
    .modal-title { font-size: 24px; }
    .modal-body { padding: 22px; }
  }
</style>
</head>

  <p style="opacity:0.5; margin-top:16px;">© 2025 Discover Russia</p>

        long: 'Kaliningrado es la antigua Königsberg, cuna del filósofo Kant. Famosa por la Catedral, la Curonian Spit, playas de ámbar y arquitectura alemana única.',
        highlights: ['Curonian Spit', 'Catedral', 'Museo del Ámbar', 'Casa de los Soviets', 'Mar Báltico'],
        season: 'Junio-agosto — cálido Mar Báltico y playas.'
      }
    ]
  }
};

let currentLang = 'ru';

function applyLang(lang) {
  currentLang = lang;
  const t = translations[lang];

  document.getElementById('logo-text').textContent = t.logo;
  document.getElementById('footer-logo').textContent = t.logo;
  document.getElementById('hero-title').innerHTML = t.heroTitle;
  document.getElementById('hero-subtitle').textContent = t.heroSubtitle;
  document.getElementById('hero-btn1').textContent = t.heroBtn1;
  document.getElementById('hero-btn2').textContent = t.heroBtn2;
  document.getElementById('cities-title').textContent = t.citiesTitle;
  document.getElementById('cities-subtitle').textContent = t.citiesSubtitle;
  document.getElementById('features-title').textContent = t.featuresTitle;
  document.getElementById('features-subtitle').textContent = t.featuresSubtitle;
  document.getElementById('footer-text').textContent = t.footerText;

  // Features
  const fg = document.getElementById('features-grid');
  fg.innerHTML = t.features.map(f => `
    <div class="feature-card">
      <div class="feature-icon">${f.icon}</div>
      <h3>${f.title}</h3>
      <p>${f.text}</p>
    </div>
  `).join('');

  // Cities
  const cg = document.getElementById('cities-grid');
  cg.innerHTML = t.cities.map((c, i) => `
    <div class="city-card" onclick="openModal(${i})">
      <div class="city-img" style="background-image: url('${c.img}')">
        <div class="city-badge">${c.region}</div>
        <div class="city-name-overlay">${c.name}</div>
      </div>
      <div class="city-body">
        <p class="city-desc">${c.desc}</p>
        <div class="city-meta">
          <span>🕐 ${c.hours}</span>
          <span>👥 ${c.pop}</span>
          <span style="margin-left:auto; color:var(--primary); font-weight:600;">${t.readMore}</span>
        </div>
      </div>
    </div>
  `).join('');

  // Update active button
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  document.documentElement.lang = lang;
}

function openModal(index) {
  const t = translations[currentLang];
  const c = t.cities[index];
  document.getElementById('modal-img').style.backgroundImage = `url('${c.img}')`;
  document.getElementById('modal-title').textContent = c.name;
  document.getElementById('modal-desc').textContent = c.long;
  document.getElementById('modal-h1').textContent = t.h1;
  document.getElementById('modal-h2').textContent = t.h2;
  document.getElementById('modal-season').textContent = c.season;
  document.getElementById('modal-highlights').innerHTML = 
    c.highlights.map(h => `<span class="highlight-tag">${h}</span>`).join('');
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

// Smooth scroll
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const el = document.querySelector(a.getAttribute('href'));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// Init
applyLang('ru');
</script>

</body>
</html>
